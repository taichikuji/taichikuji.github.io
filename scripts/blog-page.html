<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta name="author" content="Iván Pérez">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)">
  <title>{{title}} | Taichikuji</title>
  <link rel="canonical" href="{{url}}">
  <link rel="icon" type="image/png" href="../resources/db/logo.png">
  <link rel="apple-touch-icon" href="../resources/db/logo.png">
  <meta property="og:site_name" content="Taichikuji">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="{{type}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="https://taichikuji.org/resources/db/logo.png">
  <meta property="og:image:alt" content="Taichikuji logo">
  {{articleMeta}}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@taichikuji">
  <meta name="twitter:creator" content="@taichikuji">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://taichikuji.org/resources/db/logo.png">
  <meta name="twitter:image:alt" content="Taichikuji logo">
  <link rel="stylesheet" href="../resources/normalize.css">
  <link rel="stylesheet" href="https://unpkg.com/terminal.css@0.7.5/dist/terminal.min.css">
  <link rel="stylesheet" href="../resources/site.css">
</head>
<body class="terminal">
  <div class="container">
    <nav class="terminal-nav">
      <header class="terminal-logo">
        <div class="logo terminal-prompt"><a href="../index.html" class="no-style">Taichikuji</a></div>
      </header>
      <div class="terminal-menu"><ul>{{menu}}</ul></div>
    </nav>
    <main>{{content}}</main>
    {{footer}}
  </div>
  <script src="../resources/sounds.js" defer></script>
</body>
</html>
